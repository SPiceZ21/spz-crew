<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>spz-crew</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root" class="hidden">
    <div class="board">
      <!-- ── Header ─────────────────────────────────────────── -->
      <header class="hd">
        <div class="hd-brand">
          <span class="dot"></span>
          <div class="hd-txt">
            <span class="hd-title">CREW</span>
            <span class="hd-sub">Team Headquarters</span>
          </div>
        </div>

        <nav class="seg">
          <button class="seg-btn active" data-view="crew" id="seg-crew">My Crew</button>
          <button class="seg-btn" data-view="browse" id="seg-browse">Browse<span class="seg-count" id="seg-browse-n"></span></button>
        </nav>

        <button id="close" class="hd-close">CLOSE <span class="kbd">ESC</span></button>
      </header>

      <!-- ── Stage ──────────────────────────────────────────── -->
      <div class="stage">

        <!-- CREW VIEW -->
        <section class="view view-crew" data-view="crew">

          <!-- in a crew -->
          <div id="mycrew" class="hidden">
            <div class="crest">
              <div class="crest-info">
                <div class="crest-name" id="crew-name">Crew Name</div>
                <div class="crest-pills">
                  <span class="pill pill-role" id="crew-role">Member</span>
                  <span class="pill" id="st-tag">—</span>
                </div>
              </div>
              <div class="crest-metrics">
                <div class="metric"><span class="metric-v" id="st-members">0</span><span class="metric-l">Members</span></div>
                <div class="metric-div"></div>
                <div class="metric"><span class="metric-v" id="st-ir">—</span><span class="metric-l">Avg iR</span></div>
              </div>
              <div class="crest-actions">
                <button id="leave" class="btn btn-ghost">Leave Crew</button>
                <button id="disband" class="btn btn-danger hidden">Disband</button>
              </div>
            </div>

            <div class="sec-label">Roster <span class="sec-n" id="roster-n"></span></div>
            <div id="roster" class="roster"></div>
          </div>

          <!-- not in a crew: create -->
          <div id="create" class="hidden">
            <div class="create-card">
              <span class="create-emblem" id="tag-prev">?</span>
              <div class="create-title">Start Your Crew</div>
              <div class="create-hint">Pick a name and a short tag. You become the owner.</div>

              <label class="fld-label">Crew Name</label>
              <input id="in-name" class="fld" type="text" maxlength="24" placeholder="e.g. Night Runners">

              <label class="fld-label">Tag <span class="fld-note">2–4 chars, uppercase</span></label>
              <input id="in-tag" class="fld" type="text" maxlength="4" placeholder="NR">

              <button id="create-btn" class="btn btn-primary">Create Crew</button>
            </div>
          </div>
        </section>

        <!-- BROWSE VIEW -->
        <section class="view view-browse hidden" data-view="browse">
          <div class="sec-label">Browse Crews <span class="cooldown" id="cd"></span></div>
          <div id="list" class="grid"></div>
        </section>

      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
