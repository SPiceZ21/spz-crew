<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>spz-crew</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root" class="hidden">
    <div class="shell">

      <!-- ── Icon rail ─────────────────────────────────────────── -->
      <nav class="rail">
        <div class="rail-items" id="rail"></div>
        <button class="rail-btn" id="refreshBtn" title="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><polyline points="21 3 21 9 15 9"/></svg>
        </button>
        <button class="rail-btn rail-close" id="closeBtn" title="Close (ESC)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </nav>

      <!-- ── Main ──────────────────────────────────────────────── -->
      <main class="main">
        <header class="hero">
          <div class="hero-art"></div>
          <div class="hero-txt">
            <h1 class="hero-title" id="heroTitle">My crew</h1>
            <p class="hero-sub" id="heroSub">Your roster, ranked by championship points.</p>
          </div>
          <div class="hero-actions">
            <div class="hero-stat">
              <span class="hero-stat-l" id="heroCountL">Members</span>
              <span class="hero-stat-v" id="heroCount">—</span>
            </div>
            <div class="hero-btns" id="heroBtns"></div>
          </div>
        </header>

        <div class="controls">
          <label class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="searchInput" type="text" placeholder="Search" autocomplete="off">
            <span class="search-count" id="searchCount"></span>
          </label>

          <div class="seg" id="sortSeg"></div>

          <div class="controls-right">
            <div class="chipbar" id="chipbar"></div>
          </div>
        </div>

        <div class="scroll" id="scroll">
          <div class="board" id="body"></div>
        </div>
      </main>

    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
